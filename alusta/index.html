<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>betsmart – Your Betting Questionnaire</title>
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://betsmart.com/alusta/">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Cloudflare Web Analytics (Beacon statt GA4) -->
    <!-- Cloudflare Web Analytics (cookielos, ersetzt GA4) -->
    
<style>
        :root {
            --lime: #635BFF;
            --lime-light: rgba(99, 91, 255, 0.12);
            --lime-dark: #635BFF;
            --lime-glow: #7A73FF;
            --dark: #0A2540;
            --text: #0A2540;
            --text-secondary: #425466;
            --bg: #F6F9FC;
            --bg-warm: #EEF2F6;
            --card-bg: #FFFFFF;
            --card-border: #E6EBF1;
            --selected-border: #635BFF;
            --check-fill: #635BFF;
            --shadow-sm: 0 2px 8px rgba(10, 37, 64, 0.06);
            --shadow-md: 0 4px 20px rgba(10, 37, 64, 0.08);
            --shadow-lg: 0 8px 40px rgba(10, 37, 64, 0.12);
            --radius: 16px;
            --radius-sm: 12px;
            --radius-xs: 8px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Outfit', Arial, sans-serif;
            --font-body: 'Instrument Sans', Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: var(--font);
            background: #E4E6EA;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        .quiz-shell {
            width: 100%;
            max-width: 520px;
            margin: 30px auto;
            height: 100vh;
            height: 100dvh;
            background: var(--bg);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 560px) {
            body { display: block; }
            .quiz-shell {
                height: min(calc(100vh - 60px), 860px);
                height: min(calc(100dvh - 60px), 860px);
                max-height: calc(100vh - 60px);
                max-height: calc(100dvh - 60px);
                border-radius: 24px;
                box-shadow: var(--shadow-lg);
            }
        }

        @media (max-width: 559px) {
            .quiz-shell { max-width: 100%; border-radius: 0; margin: 0 auto; }
        }

        @media (max-width: 520px) {
            .quiz-shell { max-width: 100%; }
            .quiz-header { padding: 0; }
            .screen { padding: 20px 20px 0; }
            .quiz-footer { padding: 10px 20px 20px; }
            .q-title { font-size: 22px; }
        }

        /* ===== HEADER ===== */
        .quiz-header { padding: 0; flex-shrink: 0; position: relative; z-index: 10; }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            height: auto;
            min-height: 52px;
            padding: 16px 52px;
            border-bottom: 1px solid var(--card-border);
            background: var(--card-bg);
        }

        .btn-back {
            position: absolute; left: 0; top: 50%; transform: translateY(-50%);
            width: 44px; height: 44px; border-radius: 50%;
            border: 2px solid var(--card-border); background: var(--card-bg);
            display: flex; align-items: center; margin-left: 16px;
            justify-content: center; cursor: pointer;
            transition: var(--transition); opacity: 1; flex-shrink: 0; z-index: 2;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-back:hover { border-color: var(--selected-border); }
        .btn-back.hidden { opacity: 0; pointer-events: none; }
        .btn-back svg { display: block; }

        .logo { height: 28px; max-width: 180px; overflow: hidden; }
        .logo img { height: 100%; width: auto; display: block; max-width: 100%; object-fit: contain; }

        /* ===== PROGRESS ===== */
        .progress-section { padding: 14px 20px 12px; background: var(--card-bg); border-bottom: 1px solid var(--card-border); }
        .progress-section.hidden { display: none; }

        .progress-label {
            text-align: center; font-size: 10px; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase;
            color: var(--text-secondary); margin-bottom: 10px;
            font-family: var(--font);
        }

        .progress-steps { display: flex; align-items: center; gap: 6px; }

        .progress-track {
            flex: 1; height: 5px; background: var(--card-border); border-radius: 4px;
            overflow: hidden; position: relative;
        }

        .progress-fill {
            height: 100%; border-radius: 4px; background: var(--lime-dark);
            transition: width 0.5s ease; width: 0%;
        }

        .step-dot {
            width: 10px; height: 10px; border-radius: 50%; background: var(--card-border);
            flex-shrink: 0; transition: var(--transition);
        }
        .step-dot.active, .step-dot.completed { background: var(--lime-dark); }

        /* ===== BODY ===== */
        .quiz-body { flex: 1; min-height: 0; overflow: hidden; position: relative; }

        .screen {
            position: absolute; inset: 0; padding: 20px 20px 0;
            display: flex; flex-direction: column;
            overflow-y: auto; overflow-x: hidden;
            opacity: 0; pointer-events: none; will-change: transform, opacity;
        }
        .screen.active { opacity: 1; pointer-events: auto; }
        .screen.enter-right { animation: enterRight 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .screen.exit-left { animation: exitLeft 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .screen.enter-left { animation: enterLeft 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .screen.exit-right { animation: exitRight 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

        @keyframes enterRight { from { transform: translateX(80px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes exitLeft { from { transform: translateX(0); opacity: 1; } to { transform: translateX(-80px); opacity: 0; } }
        @keyframes enterLeft { from { transform: translateX(-80px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes exitRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(80px); opacity: 0; } }

        /* ===== FOOTER ===== */
        .quiz-footer { padding: 12px 24px 24px; flex-shrink: 0; position: relative; z-index: 10; background: var(--bg); }
        .quiz-footer.hidden { display: none; }

        .btn-continue {
            width: 100%; height: 56px; border-radius: 28px; border: none;
            background: #635BFF; color: #FFFFFF;
            font-family: var(--font); font-size: 17px; font-weight: 800; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: var(--transition);
            box-shadow: 0 4px 20px rgba(99, 91, 255, 0.35);
            -webkit-tap-highlight-color: transparent;
        }
        .btn-continue:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(99, 91, 255, 0.50); }
        .btn-continue:active { transform: translateY(0); }
        .btn-continue:disabled { background: #E1E4EB; color: #9CA3AF; cursor: not-allowed; box-shadow: none; transform: none; }
        .btn-continue:disabled svg { opacity: 0.3; }

        .skip-link {
            display: block; text-align: center; margin-top: 12px;
            font-size: 14px; font-weight: 600; color: var(--text-secondary);
            cursor: pointer; transition: var(--transition);
            background: none; border: none; font-family: var(--font); width: 100%;
            -webkit-tap-highlight-color: transparent;
        }
        .skip-link:hover { color: var(--lime-dark); }

        .quiz-field-error {
            display: none; margin-bottom: 10px; padding: 10px 14px;
            background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px; color: #DC2626; font-size: 14px; font-weight: 600; text-align: center;
            font-family: var(--font-body);
        }
        .quiz-field-error.visible { display: block; }

        /* ===== COMMON ELEMENTS ===== */
        .q-title {
            font-size: 24px; font-weight: 800; text-align: center; color: var(--dark);
            line-height: 1.3; margin-bottom: 20px; font-family: var(--font);
        }
        .q-subtitle {
            font-size: 14px; color: var(--text-secondary); text-align: center;
            margin-bottom: 18px; font-weight: 500; font-family: var(--font-body); line-height: 1.5;
        }

        /* ===== OPTION CARDS ===== */
        .options-list { display: flex; flex-direction: column; }

        .option-card {
            display: flex; align-items: center; gap: 14px;
            padding: 16px 18px; border: 2px solid var(--card-border);
            border-radius: var(--radius-sm); background: var(--card-bg);
            cursor: pointer; transition: var(--transition); margin-bottom: 10px;
            position: relative; -webkit-tap-highlight-color: transparent;
        }
        .option-card:hover { border-color: #C5C9D4; }
        .option-card.selected { border-color: var(--selected-border); background: var(--lime-light); }
        .option-card.selected .card-check { background: #635BFF; border-color: #635BFF; }
        .option-card.selected .card-check svg path { stroke: #FFFFFF; }
        .option-card.selected .card-check svg { opacity: 1; }

        @keyframes cardPulse { 0% { transform: scale(1); } 50% { transform: scale(1.01); } 100% { transform: scale(1); } }
        .option-card.pulse { animation: cardPulse 0.25s ease; }

        .card-icon { width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; border-radius: 10px; background: var(--bg-warm); }
        .card-icon-img { height: 34px; width: auto; display: block; }
        .card-label { flex: 1; font-size: 15px; font-weight: 600; color: var(--dark); line-height: 1.4; font-family: var(--font); }
        .card-sublabel { font-size: 12px; font-weight: 400; color: var(--text-secondary); margin-top: 2px; font-family: var(--font-body); }

        .card-check {
            width: 26px; height: 26px; border-radius: 50%; border: 2px solid #D1D5DB;
            flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            transition: var(--transition);
        }
        .card-check svg { opacity: 0; transition: var(--transition); }

        /* Simple card (no check, auto-advance) */
        .option-card.simple .card-check { display: none; }

        /* 2-col grid for league screen */
        .options-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
        .options-grid-2 .option-card { margin-bottom: 0; flex-direction: column; text-align: center; padding: 18px 12px; gap: 6px; }
        .options-grid-2 .option-card .card-icon { width: 44px; height: 44px; font-size: 26px; margin: 0 auto; }
        .options-grid-2 .option-card .card-label { font-size: 13px; text-align: center; }
        .options-grid-2 .option-card .card-check { display: none; }

        /* ===== TEXT INPUT ===== */
        .text-input-wrap { position: relative; margin-top: 16px; }
        .text-input {
            width: 100%; padding: 18px 20px; border: 2px solid var(--card-border);
            border-radius: var(--radius-sm); background: var(--card-bg);
            font-family: var(--font); font-size: 20px; font-weight: 700; color: var(--dark);
            transition: var(--transition); outline: none; text-align: center;
        }
        .text-input:focus { border-color: var(--selected-border); }
        .text-input::placeholder { color: #9CA3AF; font-weight: 400; font-size: 16px; }

        /* ===== EMAIL INPUT ===== */
        .email-input-box {
            margin-top: 20px; padding: 20px; border: 2px solid var(--card-border);
            border-radius: var(--radius); background: var(--card-bg);
            transition: border-color var(--transition);
        }
        .email-input-box:focus-within { border-color: var(--selected-border); }
        .email-label { font-size: 11px; font-weight: 700; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; font-family: var(--font); }
        .email-input {
            width: 100%; border: none; outline: none; font-family: var(--font);
            font-size: 17px; font-weight: 600; color: var(--dark); background: transparent;
        }
        .email-input::placeholder { color: #9CA3AF; font-weight: 400; }
        .email-privacy {
            margin-top: 14px; font-size: 12px; color: var(--text-secondary); text-align: center; line-height: 1.5;
            font-family: var(--font-body);
        }
        .email-privacy a { color: var(--lime-dark); text-decoration: none; }

        /* ===== TRUST BADGES (email screen) ===== */
        .trust-row { display: flex; justify-content: center; gap: 16px; margin-top: 16px; flex-wrap: wrap; }
        .trust-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text-secondary); font-family: var(--font-body); }
        .trust-badge span.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--lime-dark); flex-shrink: 0; }

        /* ===== INTERSTITIAL ===== */
        .interstitial {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; text-align: center; flex: 1; gap: 16px; padding: 20px 0;
        }
        .interstitial h2 {
            font-size: 28px; font-weight: 900; color: var(--dark); line-height: 1.2;
            font-family: var(--font);
        }
        .interstitial h2 span { color: var(--lime-dark); }
        .interstitial p { font-size: 15px; color: var(--text-secondary); line-height: 1.6; max-width: 340px; font-family: var(--font-body); }

        .sp-icon { font-size: 60px; margin-bottom: 4px; }

        .sp-stats { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 360px; }
        .sp-stat-card {
            display: flex; align-items: center; gap: 14px; padding: 14px 18px;
            background: var(--card-bg); border-radius: var(--radius-sm);
            border: 2px solid var(--card-border);
        }
        .sp-stat-icon { font-size: 24px; flex-shrink: 0; }
        .sp-stat-body { text-align: left; }
        .sp-stat-number { font-size: 18px; font-weight: 800; color: var(--dark); font-family: var(--font); }
        .sp-stat-label { font-size: 12px; color: var(--text-secondary); font-family: var(--font-body); }

        .hear-you-icon { font-size: 64px; margin-bottom: 4px; }
        .hear-you-highlight {
            display: inline-block; padding: 6px 16px; border-radius: 20px;
            background: var(--lime-light); border: 1px solid var(--selected-border);
            font-size: 13px; font-weight: 700; color: var(--lime-dark); font-family: var(--font);
        }

        /* ===== LOADER ===== */
        .loader-section { display: flex; flex-direction: column; align-items: center; padding: 10px 0; width: 100%; }
        .loader-section h2 { font-size: 22px; font-weight: 800; text-align: center; color: var(--dark); margin-bottom: 24px; font-family: var(--font); line-height: 1.3; }

        .loader-bar-item { width: 100%; margin-bottom: 16px; }
        .loader-bar-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .loader-bar-label { font-size: 13px; font-weight: 600; color: var(--text); font-family: var(--font-body); }
        .loader-bar-pct { font-size: 13px; font-weight: 700; color: var(--lime-dark); font-family: var(--font); }
        .loader-bar-track { height: 8px; background: var(--card-border); border-radius: 4px; overflow: hidden; }
        .loader-bar-fill { height: 100%; background: linear-gradient(90deg, #635BFF, #00D4FF); border-radius: 4px; width: 0%; }

        .loader-reviews { width: 100%; overflow: hidden; margin-top: 20px; border-radius: var(--radius); }
        .loader-reviews-track { display: flex; transition: transform 0.5s ease; }
        .review-card { min-width: 100%; padding: 18px; background: var(--card-bg); border: 2px solid var(--card-border); border-radius: var(--radius); }
        .review-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .review-card-author { font-size: 14px; font-weight: 700; color: var(--dark); font-family: var(--font); }
        .review-card-date { font-size: 12px; color: var(--text-secondary); margin-top: 2px; font-family: var(--font-body); }
        .review-card-stars { font-size: 14px; color: var(--lime-dark); }
        .review-card-text { font-size: 13px; color: var(--text-secondary); line-height: 1.6; font-style: italic; font-family: var(--font-body); }

        .loader-review-dots { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
        .loader-review-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--card-border); transition: background 0.3s; cursor: pointer; }
        .loader-review-dot.active { background: var(--lime-dark); }

        /* Loader popup */
        .loader-popup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; display: none; }
        .loader-popup-overlay.visible { display: block; }
        .loader-popup {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 520px; background: var(--card-bg);
            border-radius: 24px 24px 0 0; padding: 28px 24px 44px; z-index: 101; display: none;
            box-shadow: 0 -8px 40px rgba(0,0,0,0.15);
        }
        .loader-popup.visible { display: block; }
        .loader-popup-title { font-size: 20px; font-weight: 800; color: var(--dark); text-align: center; margin-bottom: 20px; font-family: var(--font); }
        .loader-popup-option {
            width: 100%; padding: 14px 18px; margin-bottom: 10px;
            border: 2px solid var(--card-border); border-radius: var(--radius-sm);
            background: var(--card-bg); font-family: var(--font); font-size: 15px; font-weight: 600;
            color: var(--dark); cursor: pointer; display: flex; align-items: center; gap: 12px;
            transition: var(--transition); text-align: left; -webkit-tap-highlight-color: transparent;
        }
        .loader-popup-option:hover { border-color: var(--selected-border); background: var(--lime-light); }
        .loader-popup-option span { font-size: 22px; flex-shrink: 0; }

        /* ===== SUMMARY ===== */
        .summary-hero { text-align: center; padding: 0 0 20px; }
        .summary-hero h2 { font-size: 24px; font-weight: 900; color: var(--dark); line-height: 1.3; font-family: var(--font); }
        .summary-name-highlight { color: var(--lime-dark); }

        .summary-tip-count-box {
            text-align: center; padding: 24px 20px; background: linear-gradient(135deg, #635BFF 0%, #7A73FF 100%); color: #FFFFFF;
            border-radius: var(--radius); margin-bottom: 20px;
        }
        .summary-tip-number {
            font-size: 64px; font-weight: 900; color: #FFFFFF;
            font-family: var(--font); line-height: 1;
        }
        .summary-tip-sublabel {
            font-size: 15px; font-weight: 600; color: rgba(255, 255, 255, 0.9);
            margin-top: 6px; font-family: var(--font-body);
        }

        .summary-profile {
            border: 2px solid var(--card-border); border-radius: var(--radius);
            overflow: hidden; background: var(--card-bg); margin-bottom: 20px;
        }

        .summary-stats { padding: 0 20px; }
        .summary-stat-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 0; border-bottom: 1px solid var(--card-border);
        }
        .summary-stat-row:last-child { border-bottom: none; }
        .summary-stat-label { font-size: 14px; color: var(--text-secondary); font-family: var(--font-body); }
        .summary-stat-value { font-size: 14px; font-weight: 700; color: var(--dark); text-align: right; max-width: 60%; font-family: var(--font); }

        /* ===== SPINNER ===== */
        .btn-spinner {
            width: 20px; height: 20px; border: 3px solid rgba(26,26,26,0.2);
            border-top-color: var(--dark); border-radius: 50%; animation: spin 0.75s linear infinite; flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== SCROLLBAR ===== */
        .screen::-webkit-scrollbar { width: 4px; }
        .screen::-webkit-scrollbar-track { background: transparent; }
        .screen::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 2px; }

        /* ===== Start-Quiz Interstitials & Animations ===== */
        .interstitial-pro {
            display: flex; flex-direction: column; align-items: center; text-align: center;
            padding: 24px 16px 0; gap: 14px; opacity: 0; transform: scale(0.97);
            animation: introScale 0.4s ease forwards;
        }
        @keyframes introScale { to { opacity: 1; transform: scale(1); } }
        .interstitial-pro h2 {
            font-size: 22px; font-weight: 800; color: var(--dark);
            font-family: var(--font); line-height: 1.25; max-width: 340px;
        }
        .interstitial-pro p {
            font-size: 15px; color: var(--text-secondary); line-height: 1.55;
            max-width: 340px; font-family: var(--font-body);
        }
        .interstitial-pro .ip-icon {
            font-size: 56px; line-height: 1;
            animation: iconPulse 1.2s ease-in-out 0.2s 1;
        }
        @keyframes iconPulse {
            0% { transform: scale(0.6); opacity: 0; }
            60% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .counter-row {
            display: flex; gap: 24px; margin: 12px 0 4px; align-items: center;
            justify-content: center; flex-wrap: wrap;
        }
        .counter-block { text-align: center; }
        .counter-value {
            font-size: 44px; font-weight: 900; color: var(--lime-dark);
            font-family: var(--font); line-height: 1;
        }
        .counter-label {
            font-size: 12px; font-weight: 700; color: var(--text-secondary);
            text-transform: uppercase; letter-spacing: 1.5px; margin-top: 6px;
            font-family: var(--font);
        }
        .anim-bar {
            width: 240px; height: 8px; background: var(--card-border);
            border-radius: 4px; overflow: hidden; margin: 10px auto 0;
        }
        .anim-bar-fill {
            height: 100%; background: var(--lime-dark); width: 0%;
            transition: width 0.9s cubic-bezier(0.22, 1, 0.36, 1);
            border-radius: 4px;
        }

        .schein-img-wrap {
            width: 100%; max-width: 380px; margin: 16px auto 0;
            border-radius: 16px; overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.10);
            opacity: 0; transform: scale(1.02);
            animation: scheinIn 0.5s ease-out 0.15s forwards;
        }
        .schein-img-wrap img { width: 100%; height: auto; display: block; }
        @keyframes scheinIn { to { opacity: 1; transform: scale(1); } }

        .sparkle-burst {
            position: relative; width: 0; height: 0; margin: 0 auto;
        }
        .sparkle-burst span {
            position: absolute; width: 6px; height: 6px; background: var(--lime-dark);
            border-radius: 50%; left: -3px; top: -3px; opacity: 0;
            animation: sparkleFly 0.8s ease-out 0.1s forwards;
        }
        .sparkle-burst span:nth-child(1) { --dx: 40px; --dy: -40px; }

    // ===== RENDER HELPERS =====
    function renderOptions(opts, variable, mode) {
        return opts.map(o => {
            const iconHTML = o.icon ? `<div class="card-icon">${o.icon}</div>` : '';
            const subHTML = o.sub ? `<div class="card-sublabel">${o.sub}</div>` : '';
            const isSimple = (mode === 'single' || mode === 'single_grid');
            const checkHTML = isSimple ? '' : `<div class="card-check">${checkSVGInline()}</div>`;
            return `<div class="option-card${isSimple ? ' simple' : ''}"
    onclick="handleOption(this,'${variable}','${o.value}','${mode}')"
    data-value="${o.value}">
    ${iconHTML}<div class="card-label">${o.label}${subHTML}</div>${checkHTML}
  </div>`;
        }).join('');

    function checkSVGInline() {
        return `<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6L5 9L10 3" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    }
    // ===== Counter-up Animation =====
    function animateCounter(el, target, dur) {
        if (!el) return;
        const start = performance.now();
        function tick(now) {
            const t = Math.min((now - start) / dur, 1);
            const eased = 1 - Math.pow(1 - t, 3); // easeOutCubic
            el.textContent = Math.round(eased * target).toString();
            if (t < 1) requestAnimationFrame(tick);
            else el.textContent = target.toString();
        }
        requestAnimationFrame(tick);
    }
    function fillBar(el, pct) {
        if (!el) return;
        requestAnimationFrame(() => { el.style.width = pct + '%'; });
    }

    // ===== OPTION HANDLERS =====
    function handleOption(el, variable, value, mode) {
        if (transitioning) return;
        if (mode === 'single' || mode === 'single_grid') {
            el.parentElement.querySelectorAll('.option-card').forEach(s => s.classList.remove('selected'));
            el.classList.add('selected', 'pulse');
            setTimeout(() => el.classList.remove('pulse'), 300);
            S[variable] = value;
            setTimeout(() => goNext(), 350);
        } else if (mode === 'single_check') {
            el.parentElement.querySelectorAll('.option-card').forEach(s => s.classList.remove('selected'));
            el.classList.add('selected');
            S[variable] = value;
            updateContinueState();
        } else if (mode === 'multi') {
            el.classList.toggle('selected');
            el.classList.add('pulse');
            setTimeout(() => el.classList.remove('pulse'), 300);
            const selected = el.parentElement.querySelectorAll('.option-card.selected');
            S[variable] = Array.from(selected).map(s => s.dataset.value);
            updateContinueState();
        }
    }

    // ===== NAVIGATION =====
    function goNext() {
        if (transitioning) return;
        const validation = getRequiredValidation(SCREENS[currentIdx]);
        if (validation.required && !validation.valid) { showQuizError(validation.message); return; }
        hideQuizError();
        let nextIdx = currentIdx + 1;
        while (nextIdx < SCREENS.length && SCREENS[nextIdx].disabled) nextIdx++;
        // Skip schein_interstitial if user picked einzelwetten
        if (SCREENS[currentIdx].id === 'interstitial_1' && S.bet_type === 'einzelwetten') nextIdx++;
        // Skip bad_experience if user hasn't tried other groups
        if (SCREENS[currentIdx].id === 'tried_other_groups' && S.tried_other_groups !== 'ja') nextIdx++;
        if (nextIdx >= SCREENS.length) return;
        history.push(currentIdx);
        saveQuizCookie();
        transitionTo(nextIdx, 'forward');
    }

    function goBack() {
        if (transitioning || history.length === 0) return;
        hideQuizError();
        const prevIdx = history.pop();
        transitionTo(prevIdx, 'back');
    }

    function handleSkip() { goNext(); }

    function transitionTo(idx, dir) {
        transitioning = true;
        const curr = document.querySelector('.screen.active');
        const next = document.querySelectorAll('.screen')[idx];
        if (dir === 'forward') {
            curr.classList.add('exit-left'); curr.classList.remove('active');
            next.classList.add('active', 'enter-right');
        } else {
            curr.classList.add('exit-right'); curr.classList.remove('active');
            next.classList.add('active', 'enter-left');
        }
        setTimeout(() => {
            curr.classList.remove('exit-left', 'exit-right', 'enter-left', 'enter-right');
            next.classList.remove('enter-left', 'enter-right');
            currentIdx = idx;
            updateUI();
            transitioning = false;
            onScreenEnter(SCREENS[idx].id);
            if (dir === 'forward' && history.length > 0) {
                const prevScreen = SCREENS[history[history.length - 1]];
                if (prevScreen) trackQuizStep(prevScreen.id, getAnswerForScreen(prevScreen.id));
            }
        }, 400);
    }

    function updateUI() {
        const scr = SCREENS[currentIdx];

        // Back button
        const backBtn = document.getElementById('btnBack');
        backBtn.classList.toggle('hidden', !scr.back);

        // Progress
        const progSection = document.getElementById('progressSection');
        const progLabel = document.getElementById('progressLabel');
        if (scr.group > 0) {
            progSection.classList.remove('hidden');
            progLabel.textContent = GROUP_LABELS[scr.group];
            updateProgress(scr.group);
        } else {
            progSection.classList.add('hidden');

        // Footer
        const footer = document.getElementById('quizFooter');
        const btn = document.getElementById('btnContinue');

        // Telegram-Pulse-Button nur auf result_b. Standardmäßig vorher entfernen.
        btn.classList.remove('btn-telegram');

        if (scr.footer === 'hidden') {
            footer.classList.add('hidden');

            footer.classList.remove('hidden');

            if (scr.footer === 'none') {
                btn.style.display = 'none'; skip.style.display = 'none';

                btn.style.display = 'flex'; btn.disabled = false;

                skip.style.display = 'none';

                btn.style.display = 'flex';

                skip.style.display = scr.skip ? 'block' : 'none';
                if (scr.skip) { skip.textContent = scr.skip; skip.onclick = function () { handleSkip(); }; }
                updateContinueState();

                btn.style.display = 'flex';
                btn.classList.add('btn-telegram');
                btn.innerHTML = 'Confirm Access on Telegram ' + arrowSVGBtn();

    function updateProgress(group) {
        const screensInGroup = GROUP_SCREENS[group];
        const currentInGroup = screensInGroup.indexOf(currentIdx);
        const pct = currentInGroup >= 0 ? ((currentInGroup + 1) / screensInGroup.length) * 100 : 0;
        for (let g = 1; g <= 4; g++) {

            if (!fill || !dot) continue;
            if (g < group) {

            } else if (g === group) {
                fill.style.width = pct + '%'; dot.className = 'step-dot' + (pct >= 100 ? ' completed' : '');

    // ===== LOADER =====

        const dots = document.querySelectorAll('.loader-review-dot');
        if (!track) return;
        const total = track.children.length;
        loaderReviewIdx = (loaderReviewIdx + 1) % total;
        track.style.transform = `translateX(-${loaderReviewIdx * 100}%)`;
        dots.forEach((d, i) => d.classList.toggle('active', i === loaderReviewIdx));
    }
    function startReviewRotation() { loaderReviewIdx = 0; loaderReviewTimer = setInterval(rotateLoaderReview, 3500); }
    function stopReviewRotation() { if (loaderReviewTimer) { clearInterval(loaderReviewTimer); loaderReviewTimer = null; } }

        const barsContainer = document.getElementById('loaderBars');
        const DUR = 2000;
        const timingLabel = S.tip_timing === 'morgen' ? "Selecting tomorrow's optimal predictions"
            : "Selecting today's optimal predictions";
        const steps = [
            { label: 'Analyzing your betting profile', dur: DUR },
            { label: timingLabel, dur: DUR },
            { label: 'Personalizing your prediction strategy', dur: DUR },

    </div>`).join('');

        // Worker-Call (Airtable + CAPI) parallel zum Loader, fire-and-forget mit 8s-Timeout-Race
        (async () => {

            const fbEventId = 'CompleteRegistration_enn1_' + (S._user_id || '') + '_' + Date.now();
            try {
                if (CONFIG.QUIZ_PROXY_URL && !CONFIG.QUIZ_PROXY_URL.includes('YOUR-WORKER')) {

                    payload.event_id = fbEventId;
                    await Promise.race([

                } else {

                    ]);

        document.getElementById('loaderPopup')?.classList.remove('visible');
        document.getElementById('loaderPopupOverlay')?.classList.remove('visible');

        let start = null;

            const val = Math.round(progress * 100);
            fill.style.width = val + '%';
            pct.textContent = val + '%';
            if (progress < 1) requestAnimationFrame(step);
            else if (onComplete) onComplete();

        const m = S.current_method;
        const h = (S.holdback && S.holdback.length > 0) ? S.holdback[0] : 'nichts';
        if (m && PROFILE_MAP[m] && PROFILE_MAP[m][h]) return PROFILE_MAP[m][h];
        return 'active bettor';
    }

    function populateResultA() {
        // Tipp-Count deterministisch aus der Wett-Frequenz, clamped [10,30]
        const freqCount = { taeglich: 24, mehrmals: 18, woechentlich: 14, seltener: 12 };
        const tipCount = Math.max(10, Math.min(30, freqCount[S.frequency] || 16));
        const sumTipCount = document.getElementById('sumTipCount');
        if (sumTipCount) sumTipCount.textContent = tipCount;

        const rows = [];
        rows.push({ label: 'Predictions', value: RES_TIP_TIMING[S.tip_timing] || '–' });
        rows.push({ label: 'Bet Type',    value: RES_BET_TYPE[S.bet_type] || '–' });
        rows.push({ label: 'Frequency',   value: RES_FREQUENCY[S.frequency] || '–' });
        rows.push({ label: 'Stake',       value: RES_BET_SIZE[S.bet_size]   || '–' });

        const sumStats = document.getElementById('sumStats');
        if (sumStats) {
            sumStats.innerHTML = rows.map(r => `
      <div class="summary-stat-row">
        <div class="summary-stat-label">${r.label}</div>
        <div class="summary-stat-value">${r.value}</div>
      </div>`).join('');
        }

        const profileEl = document.getElementById('resultProfileLine');
        if (profileEl) profileEl.textContent = 'Your Profile: ' + buildResultProfile();
    }

    // ===== REDIRECT =====
    function doClaimRedirect() {
        logQuiz('Quiz', 'CTA click → redirect to Telegram bot');
        const btn = document.querySelector('#quizFooter .btn-continue');
        if (btn) { btn.disabled = true; btn.innerHTML = '<span class="btn-spinner"></span>Redirecting …'; }
        const redirectUrl = CONFIG.TELEGRAM_REDIRECT_URL + (S._user_id || '');
        // Whop-Lead VOR dem tg://-Redirect (fremde App, Pixel kann dort nicht nachfeuern)
        try { if (window.whop) whop.track('lead', { external_id: S._user_id || undefined }); } catch (e) {}
        let redirected = false;
        function doRedirect() { if (redirected) return; redirected = true; window.location.href = redirectUrl; }
        try {
            if (typeof gtag === 'function') {
                gtag('event', 'claim_bonus_enn1', {
                    quiz_user_id: S._user_id,
                    method: 'telegram_redirect',
                    position: 'result_b',
                    quiz_name: CONFIG.QUIZ_NAME,
                    event_callback: doRedirect,
                    event_timeout: 1500,
                });
                setTimeout(doRedirect, 2000);
            } else { doRedirect(); }
        } catch (e) { doRedirect(); }
    }

    // ===== INTEGRATIONS =====
    function getUrlParams() { return new URLSearchParams(window.location.search); }

    function buildQuizPayload() {
        const urlParams = getUrlParams();
        const payload = {
            user_id: S._user_id,
            email: '',                          // /start collects no email
            quiz_name: CONFIG.QUIZ_NAME,
            tip_timing: S.tip_timing,
            bet_type: S.bet_type,
            online_betting: null,               // /start doesn't ask this; worker accepts null
            tried_other_groups: S.tried_other_groups,
            frequency: S.frequency,
            bet_size: S.bet_size,
            bet_volume_target: S.bet_volume_target,
            current_method: S.current_method,
            current_satisfaction: S.current_satisfaction,
            mid_quiz_fun: S.mid_quiz_fun,
            marketing_optin: false,
            fbclid: urlParams.get('fbclid') || '',
            utm_source: urlParams.get('utm_source') || '',
            utm_medium: urlParams.get('utm_medium') || '',
            utm_campaign: urlParams.get('utm_campaign') || '',
            country: urlParams.get('country') || '',
            page_url: window.location.href,
            _fbp: getCookie('_fbp') || undefined,
            _fbc: getCookie('_fbc') || undefined,
            wuid: getCookie('_wuid') || undefined,   // ← Whop-Pixel-Cookie, Join-Key für Lead + Purchase
        };
        // Empty arrays must be omitted (Airtable 422 on empty multi-select)
        if (S.sports   && S.sports.length)   payload.sports   = S.sports;
        if (S.leagues  && S.leagues.length)  payload.leagues  = S.leagues;
        if (S.holdback && S.holdback.length) payload.holdback = S.holdback;
        return payload;
    }

    async function sendToProxy(action, payload, opts) {
        if (!CONFIG.QUIZ_PROXY_URL || CONFIG.QUIZ_PROXY_URL.includes('YOUR-WORKER')) return null;
        const body = Object.assign({ action }, payload);
        logQuiz('Proxy', 'Sending', { action, url: CONFIG.QUIZ_PROXY_URL });
        try {
            const res = await fetch(CONFIG.QUIZ_PROXY_URL, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body), keepalive: opts && opts.keepalive,
            });
            const json = await res.json().catch(() => ({}));
            logQuiz('Proxy', 'Response', { status: res.status, ok: res.ok, body: json });
            return json;
        } catch (e) { logQuiz('Proxy', 'Error', String(e.message)); return null; }
    }

    async function sendWebhook() {
        if (!CONFIG.WEBHOOK_URL) { logQuiz('Webhook', 'Skip: no URL'); return; }
        const payload = buildQuizPayload();
        delete payload._fbp; delete payload._fbc;
        try {
            const res = await fetch(CONFIG.WEBHOOK_URL, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
            });
            logQuiz('Webhook', 'Response', { status: res.status, ok: res.ok });
        } catch (e) { logQuiz('Webhook', 'Error', String(e.message)); }
    }

    async function sendToAirtable() {
        if (!CONFIG.AIRTABLE_PAT) { logQuiz('Airtable', 'Skip: no PAT'); return; }
        const urlParams = getUrlParams();
        const fields = {
            'user_id':          S._user_id || '',
            'URL':              window.location.href,
            'Fbclid':           urlParams.get('fbclid') || '',
            'Detected Country': urlParams.get('country') || '',
            'Utm source':       urlParams.get('utm_source') || '',
            'Utm campaign':     urlParams.get('utm_campaign') || '',
            'Utm medium':       urlParams.get('utm_medium') || '',
            'quiz_name':        CONFIG.QUIZ_NAME,
            'tip_timing':       S.tip_timing || '',
            'bet_type':         S.bet_type   || '',
            'tried_other_groups': S.tried_other_groups || '',
            'frequency':        S.frequency  || '',
            'sports':           (S.sports   || []).join(', '),
            'leagues':          (S.leagues  || []).join(', '),
            'bet_size':         S.bet_size   || '',
            'bet_volume_target':S.bet_volume_target || '',
            'current_method':   S.current_method   || '',
            'current_satisfaction': S.current_satisfaction != null ? String(S.current_satisfaction) : '',
            'holdback':         (S.holdback || []).join(', '),
            'mid_quiz_fun':     S.mid_quiz_fun || '',
            'marketing_optin':  'Nein',
        };
        const apiUrl = 'https://api.airtable.com/v0/' + CONFIG.AIRTABLE_BASE_ID + '/' + CONFIG.AIRTABLE_TABLE_ID;
        try {
            const res = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + CONFIG.AIRTABLE_PAT, 'Content-Type': 'application/json' },
                body: JSON.stringify({ records: [{ fields }] }),
            });
            logQuiz('Airtable', 'Response', { status: res.status, ok: res.ok });
        } catch (e) { logQuiz('Airtable', 'Error', String(e.message)); }
    }

    // ===== FACEBOOK PIXEL + CAPI =====
    function initFacebookPixel() {
        if (window.__fbPixelInited) return;
        if (!CONFIG.FB_PIXEL_ID || CONFIG.FB_PIXEL_ID.includes('YOUR_')) return;
        window.__fbPixelInited = true;
        (function (f, b, e, v, n, t, s) {
            if (f.fbq) return; n = f.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments) };
            if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0';
            n.queue = []; t = b.createElement(e); t.async = !0; t.src = v; s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s);
        })(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
        try { fbq('init', CONFIG.FB_PIXEL_ID); fbq('track', 'PageView'); } catch (e) {}
    }

    async function sha256Hex(str) {
        const enc = new TextEncoder().encode(str);
        const digest = await crypto.subtle.digest('SHA-256', enc);
        return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function fireFBConversion(sharedEventId) {
        // /start fires NO browser pixel CompleteRegistration event by design.
        // CAPI fires server-side via the Worker (submit_email action).
        // Function kept as a no-op for forward-compat.
        return;
    }

    // ===== GA TRACKING =====
    function getAnswerForScreen(id) {
        switch (id) {
            case 'tip_timing':           return S.tip_timing || '';
            case 'bet_type':             return S.bet_type || '';
            case 'frequency':            return S.frequency || '';
            case 'bet_size':             return S.bet_size || '';
            case 'bet_volume_target':    return S.bet_volume_target || '';
            case 'tried_other_groups':   return S.tried_other_groups || '';
            case 'current_method':       return S.current_method || '';
            case 'current_satisfaction': return S.current_satisfaction != null ? String(S.current_satisfaction) : '';
            case 'holdback':             return (S.holdback || []).join(', ');
            default:                     return '';
        }
    }

    function trackQuizStep(screenId, answer) {
        if (typeof gtag !== 'function') return;
        gtag('event', 'quiz_step_enn1', {
            quiz_user_id: S._user_id,
            quiz_name: CONFIG.QUIZ_NAME,
            step_name: screenId,
            step_answer: typeof answer !== 'undefined' ? answer : '',
            step_index: currentIdx,
        });
    }

    // ===== INIT =====
    document.addEventListener('DOMContentLoaded', () => {
        const savedIdx = loadQuizCookie();

        if (typeof gtag === 'function' && S._user_id) {
            gtag('config', CONFIG.GA_MEASUREMENT_ID, { user_id: S._user_id });
        }

        initFacebookPixel();
        buildAllScreens();

        // Debug: ?screen=screen_id jumps to that screen
        const debugScreen = new URLSearchParams(window.location.search).get('screen');
        if (debugScreen) {
            const targetIdx = SCREENS.findIndex(s => s.id === debugScreen);
            if (targetIdx >= 0) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.querySelectorAll('.screen')[targetIdx].classList.add('active');
                currentIdx = targetIdx;
                setTimeout(() => onScreenEnter(debugScreen), 200);
            }
        } else if (typeof savedIdx === 'number' && savedIdx > 0 && savedIdx < SCREENS.length) {
            // Resume at last saved screen (skip loader/result screens — those re-trigger their side-effects).
            const terminalIds = new Set(['loader', 'result_a', 'result_b']);
            const resumeIdx = terminalIds.has(SCREENS[savedIdx].id) ? 0 : savedIdx;
            if (resumeIdx > 0) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.querySelectorAll('.screen')[resumeIdx].classList.add('active');
                currentIdx = resumeIdx;
                // Reconstruct minimal history so back-button works (one step back to start).
                history.push(0);
                setTimeout(() => onScreenEnter(SCREENS[resumeIdx].id), 200);
            }
        }

        updateUI();
    });
</script>
